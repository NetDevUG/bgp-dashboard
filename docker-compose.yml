services:
  gobgp:
    build: ./gobgp
    init: true
    restart: unless-stopped
    ports:
      - "179:179"
    volumes:
      # The directory (not only the file) is mounted, so edits of gobgpd.conf are seen
      # in the container and applied automatically (GOBGP_CONFIG_AUTO_RELOAD).
      - ./gobgp:/etc/gobgp:ro
    environment:
      MONGO_URI: mongodb://mongodb:27017
      GOBGP_CONFIG_AUTO_RELOAD: "true"
      MAX_PREFIX_HISTORY: "100"
      NEIGHBOR_POLL_INTERVAL: "10"   # seconds, 0 = no BGP session monitoring
      NEIGHBOR_EVENT_DAYS: "90"
      LOG_LEVEL: INFO
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:${MONGO_VERSION:-8}
    restart: unless-stopped
    command: ["--quiet", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    expose:
      - "27017"
    volumes:
      - ./db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ./web
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:8000"
    volumes:
      - ./config/dashboard.toml:/config/dashboard.toml:ro
    environment:
      MONGO_URI: mongodb://mongodb:27017
      LOG_LEVEL: INFO
    depends_on:
      mongodb:
        condition: service_healthy
