name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.15, MongoDB 8)
    runs-on: ubuntu-latest
    container: python:3.15-slim
    services:
      mongo:
        image: mongo:8
    env:
      TEST_MONGO_URI: mongodb://mongo:27017
      REQUIRE_MONGO: "1"   # fail instead of skipping the MongoDB tests
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install --no-cache-dir --root-user-action=ignore -r web/requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v -rs

  alert-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: promtool check and unit tests
        run: |
          docker run --rm -v "$PWD/monitoring:/r" -w /r --entrypoint promtool prom/prometheus:latest check rules bgp-alerts.yml
          docker run --rm -v "$PWD/monitoring:/r" -w /r --entrypoint promtool prom/prometheus:latest test rules bgp-alerts.test.yml

  images:
    name: Image ${{ matrix.image }}
    needs: [tests, alert-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, gobgp]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bgp-dashboard-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
