version: 2
updates:
  - package-ecosystem: pip
    directories: ["/web", "/gobgp"]
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/web", "/gobgp"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
