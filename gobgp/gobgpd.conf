# GoBGP configuration – peer with your real network here.
# This file is mounted into the container and changes are applied automatically
# within a second (check with: docker compose logs gobgp | grep -i reload).
# Only sessions whose settings changed are reset, the others keep running.
# Docs: https://github.com/osrg/gobgp/blob/master/docs/sources/configuration.md
#
# If the Docker host has no IPv6, add to [global.config]:
#   local-address-list = ["0.0.0.0"]
#
# BGP Add-Path (receive all paths of a router, not only its best one):
# add to every [[neighbors.afi-safis]] block
#     [neighbors.afi-safis.add-paths.config]
#     receive = true
# and enable sending on the router (MikroTik RouterOS >= 7.22:
#   /routing/bgp/connection set <name> output.add-path=ip,ipv6)

[global.config]
  as = 3701
  router-id = "207.98.65.28"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "207.98.64.254"
    peer-as = 3701
    route-flap-damping = "True"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
    afi-safi-name = "ipv4-unicast"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
    afi-safi-name = "ipv6-unicast"
